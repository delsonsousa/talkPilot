<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22" role="img" aria-label="TalkPilot menu bar">
  <title>TalkPilot</title>
  <desc>Ícone monocromático para macOS menu bar (template image — macOS aplica o tinting).</desc>

  <!-- Mic body (filled capsule) -->
  <rect x="8" y="3" width="6" height="10" rx="3" fill="#000000"/>

  <!-- Mic stand (U arc) -->
  <path d="M 5 11 Q 5 17 11 17 Q 17 17 17 11"
        fill="none" stroke="#000000" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stem -->
  <line x1="11" y1="17" x2="11" y2="20"
        stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
